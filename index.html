<style>
:root{
  --bg:#fbfbfd;
  --bg-2:#f5f5f7;
  --ink:#1d1d1f;
  --ink-2:#6e6e73;
  --ink-3:#86868b;
  --hair:rgba(0,0,0,.09);
  --blur-bar:rgba(251,251,253,.72);
  --orb-a:rgba(120,160,255,.28);
  --orb-b:rgba(255,175,120,.26);
  --orb-c:rgba(190,140,255,.20);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000;
    --bg-2:#0a0a0c;
    --ink:#f5f5f7;
    --ink-2:#a1a1a6;
    --ink-3:#6e6e73;
    --hair:rgba(255,255,255,.11);
    --blur-bar:rgba(0,0,0,.68);
    --orb-a:rgba(90,130,255,.26);
    --orb-b:rgba(255,150,90,.20);
    --orb-c:rgba(170,110,255,.20);
  }
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100svh;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-weight:400;
  letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  overflow-x:hidden;
}
::selection{background:rgba(0,113,227,.18)}

/* ---------- top bar ---------- */
.bar{
  position:fixed;top:0;left:0;right:0;z-index:20;
  height:48px;
  display:flex;align-items:center;justify-content:center;
  background:var(--blur-bar);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--hair);
}
.bar .mark{
  font-family:'Noto Serif Gurmukhi',serif;
  font-size:1.05rem;line-height:1;
  color:var(--ink);opacity:.85;
}

/* ---------- ambient ---------- */
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;filter:blur(70px)}
.orb{position:absolute;border-radius:50%;will-change:transform}
.o1{width:46vmax;height:46vmax;left:-10vmax;top:-8vmax;background:var(--orb-a);animation:float1 26s ease-in-out infinite}
.o2{width:40vmax;height:40vmax;right:-12vmax;top:18vmax;background:var(--orb-b);animation:float2 32s ease-in-out infinite}
.o3{width:36vmax;height:36vmax;left:22vmax;bottom:-16vmax;background:var(--orb-c);animation:float3 29s ease-in-out infinite}

/* ---------- hero ---------- */
main{
  position:relative;z-index:5;
  flex:1;
  display:grid;place-items:center;
  text-align:center;
  padding:9rem 1.5rem 5rem;
}
.eyebrow{
  font-size:.8rem;font-weight:500;
  letter-spacing:.02em;
  color:#0071e3;
  margin-bottom:1.1rem;
}
@media (prefers-color-scheme:dark){.eyebrow{color:#2997ff}}

h1{
  font-size:clamp(2.6rem,7.4vw,5.4rem);
  font-weight:600;
  line-height:1.06;
  letter-spacing:-.032em;
  max-width:19ch;
  margin-inline:auto;
  text-wrap:balance;
}
.sub{
  margin-top:1.5rem;
  font-size:clamp(1.05rem,2.1vw,1.4rem);
  font-weight:400;
  line-height:1.5;
  letter-spacing:-.01em;
  color:var(--ink-2);
  max-width:36ch;
  margin-inline:auto;
  text-wrap:balance;
}

.meta{
  margin-top:3.4rem;
  display:inline-flex;align-items:center;gap:.65rem;
  padding:.55rem 1.05rem;
  border:1px solid var(--hair);
  border-radius:980px;
  font-size:.86rem;
  color:var(--ink-2);
  background:color-mix(in srgb,var(--bg-2) 70%,transparent);
  backdrop-filter:blur(10px);
}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:#30d158;
  box-shadow:0 0 0 0 rgba(48,209,88,.55);
  animation:ping 2.6s ease-out infinite;
}

/* ---------- footer ---------- */
footer{
  position:relative;z-index:5;
  padding:1.9rem 1.5rem 2.4rem;
  border-top:1px solid var(--hair);
  text-align:center;
}
footer p{font-size:.76rem;color:var(--ink-3);letter-spacing:0}

/* ---------- motion ---------- */
.rise{opacity:0;transform:translateY(20px);animation:rise 1.15s cubic-bezier(.16,1,.3,1) forwards}
.d1{animation-delay:.12s}
.d2{animation-delay:.24s}
.d3{animation-delay:.38s}
.d4{animation-delay:.56s}

@keyframes rise{to{opacity:1;transform:none}}
@keyframes ping{
  0%{box-shadow:0 0 0 0 rgba(48,209,88,.5)}
  70%{box-shadow:0 0 0 9px rgba(48,209,88,0)}
  100%{box-shadow:0 0 0 0 rgba(48,209,88,0)}
}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,4vmax) scale(1.12)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-7vmax,5vmax) scale(1.08)}}
@keyframes float3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4vmax,-6vmax) scale(1.14)}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .rise{opacity:1;transform:none}
}
</style>
</head>

  <span class="orb o1"></span>
  <span class="orb o2"></span>
  <span class="orb o3"></span>
</div>

<main>
  <div>
    <p class="eyebrow rise d1">jagroopgill.com</p>
    <h1 class="rise d2">Something is on the way.</h1>
    <p class="sub rise d3">This page is being built with care. It will be here soon — thank you for your patience.</p>
    <div class="meta rise d4"><span class="dot" aria-hidden="true"></span> In progress</div>
  </div>
</main>

<footer>
  <p>© 2026 Jagroop Gill. All rights reserved.</p>
</footer>

</body>
